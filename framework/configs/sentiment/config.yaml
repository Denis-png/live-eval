api_keys:
  groq: "${GROQ_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  openrouter: "${OPENROUTER_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  minimax: "${MINIMAX_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  huggingface: "${HF_TOKEN}"

# ── Dataset ─────────────────────────────────────────────────────────────────
# TweetEval sentiment: 3-class Twitter data (NEG=0, NEU=1, POS=2).
# Same benchmark used to train the bertweet and RoBERTa sentiment models below.
# The benchmark is the first 150 tweets of its test split. framework/data/** is
# gitignored, so build the CSV once:
#   python -m scripts.prepare_sentiment_benchmark
dataset:
  source: local
  local:
    path: "framework/data/benchmarks/sentiment/tweeteval_test_150.csv"
    format: csv

# ── Generation ───────────────────────────────────────────────────────────────
# Strategy: "corruption" — the LLM rewrites a real tweet, injecting one of the
# sentiment error types defined in configs/sentiment/sentiment.json.
# Shipped cell: forward + seeded, the baseline. Other cells: --mode, --seedless.
# Seedless cells need a profile with topics:
#   python -m framework.profile_dataset --task sentiment --topics \
#       --config framework/configs/sentiment/config.yaml
generation:
  mode: forward
  seedless: false
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 1.0
  max_tokens: 65536            # HARD CAP on the response, honoured by every provider
                              # (a cap, not a spend: you pay for tokens used). Every LLM call in
                              # every task gets the same 65536, and every sweep model
                              # accepts at least 128000.
                             # A tweet rewrite is short, but a reasoning model spends
                             # its budget on <think> before emitting any of it: at 512
                             # it returns finish_reason=length and the sample is lost.
  num_runs: 3
  sample_size: 150
  timeout: 1200                # per-request HTTP timeout in seconds (SDK default: 600),
                              # sized to the cap: a 32768-token answer took ~4 min
                              # (taxonomy, 2026-09-14), so at 300 s anything past ~40k
                              # tokens would time out and be retried instead of finishing.
  max_retries: 2
  request_delay: 1.0           # seconds between requests; one value for every task

# ── Profiling (LLM used by profile_dataset --topics) ──
profiling:
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 0
  max_tokens: 65536            # the uniform cap; see generation
  timeout: 1200
  max_retries: 2

# Off by default: the judge is an ablation condition, not part of the baseline.
# The final sweep's runs are unjudged, and one run of each task's best cell
# adds it: python -m framework.main --config <this file> ... --judge
judge:
  enabled: false
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 0
  max_tokens: 65536            # the uniform cap; see generation
  timeout: 1200
  max_retries: 1

evaluation:
  real_baseline: true

task:
  name: "sentiment"

# ── Task Models ──────────────────────────────────────────────────────────────
# Both models were fine-tuned on TweetEval sentiment — the same benchmark
# we draw our seeds from, so results are comparable to published scores.
task_models:
  - name: "finiteautomata/bertweet-base-sentiment-analysis"
    type: "bertweet"
  - name: "lxyuan/distilbert-base-multilingual-cased-sentiments-student"
    type: "multilingual"

compute:
  device: cpu

output:
  base_dir: "framework/data/runs"
  plots: true
