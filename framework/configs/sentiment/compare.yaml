# Multi-model comparison for sentiment. Every setting comes from config.yaml, so a
# comparison differs from a normal run ONLY in the generation model:
#   python -m scripts.compare_models --config framework/configs/sentiment/compare.yaml
# The cell is config.yaml's; for another one, copy config.yaml, edit it, and
# point base_config at the copy.
base_config: config.yaml

generation_models:
  - {provider: openrouter, model: z-ai/glm-5.3-flash, temperature: 1.0}
  - {provider: openrouter, model: deepseek/deepseek-v4-flash-0731, temperature: 1.0}
  - {provider: openrouter, model: xiaomi/mimo-v2.5, temperature: 1.0}
  - {provider: openrouter, model: tencent/hy3, temperature: 1.0}
  - {provider: openrouter, model: openai/gpt-5.6-luna, temperature: 1.0}
  - {provider: openrouter, model: minimax-m3, temperature: 1.0}
