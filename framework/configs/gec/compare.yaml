# Multi-model comparison for gec. Every setting comes from config.yaml, so a
# comparison differs from a normal run ONLY in the generation model:
#   python -m scripts.compare_models --config framework/configs/gec/compare.yaml
# The cell is config.yaml's; for another one, copy config.yaml, edit it, and
# point base_config at the copy.
base_config: config.yaml

generation_models:
  - {provider: openrouter, model: z-ai/glm-5.2, temperature: 1.0}
  - {provider: openrouter, model: xiaomi/mimo-v2.5, temperature: 1.0}
  - {provider: openrouter, model: 'tencent/hy3:free', temperature: 1.0}
