# GEC inverse multi-model comparison — fills the model-impact grid for gec.
# Mirrors the config used for gec_inverse_minimax_m3 (judge = openrouter/minimax-m3,
# fce.m2, 3 runs x 150 samples); only generation_models differ.
# Run with:  .venv/bin/python -m scripts.compare_models --config framework/configs/gec/compare.yaml
api_keys:
  groq: "${GROQ_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  openrouter: "${OPENROUTER_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  minimax: "${MINIMAX_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  huggingface: "${HF_TOKEN}"

dataset:
  source: local
  local:
    path: "framework/data/gec/fce.m2"
    format: m2

generation:
  mode: "inverse"
  seedless: false              # true = generate from the profile only, no real seeds
  # profile_path: "framework/data/profiles/gec_profile.json"   # default shown; read only when seedless
  provider: "openrouter"           # superseded per generation_models entry
  model: "minimax-m3"
  temperature: 1.0
  max_tokens: 1024
  num_runs: 3
  sample_size: 150
  class_balance: empirical
  timeout: 300
  max_retries: 2
  request_delay: 10

judge:
  enabled: true
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 0
  max_tokens: 1024
  timeout: 300
  max_retries: 1

evaluation:
  real_baseline: true

task:
  name: "gec"

task_models:
  - name: "vennify/t5-base-grammar-correction"
    type: "t5"
  - name: "prithivida/grammar_error_correcter_v1"
    type: "gec_v1"
  - name: "grammarly/coedit-large"
    type: "coedit"

compute:
  device: cpu

output:
  base_dir: "framework/data/runs"
  plots: true

# Free-tier model last: a hard failure there must not block the paid entries.
generation_models:
  - provider: openrouter
    model: z-ai/glm-5.2
    temperature: 1.0
  - provider: openrouter
    model: xiaomi/mimo-v2.5
    temperature: 1.0
  - provider: openrouter
    model: tencent/hy3:free
    temperature: 1.0
