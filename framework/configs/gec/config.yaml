# ── API keys ────────────────────────────────────────────────
# Values use ${ENV_VAR} substitution. Copy example.env → .env
# in the repo root and fill in your keys (or export them in your shell).
# Generators auto-resolve api_keys[provider]; the claude evaluator picks
# api_keys.anthropic. Leave entries you don't use blank.
api_keys:
  groq: "${GROQ_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  openrouter: "${OPENROUTER_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  minimax: "${MINIMAX_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  huggingface: "${HF_TOKEN}"

# ── Dataset ─────────────────────────────────────────────────
dataset:
  source: local # huggingface | local
  local:
    path: "framework/data/gec/fce.m2"
    format: m2 # m2 | csv | tsv (optional — inferred from the extension)

# ── Generation (LLM that creates synthetic corrupted sentences) ──
generation:
  mode: "inverse"                  # forward | inverse — the full switch; modes need no extra config
  seedless: false              # true = generate from the profile only, no real seeds
  # profile_path: "framework/data/profiles/gec_profile.json"   # default shown; read only when seedless
  provider: "openrouter"           # groq | openai | openrouter | mistral | minimax | anthropic | google
  model: "minimax-m3"
  temperature: 1.0             # CoT 3-step prompt benefits from higher T
  max_tokens: 1024             # required by Anthropic; ignored by OpenAI-compatible providers
  num_runs: 3                  # repeat N times → outputs mean ± std
  sample_size: 150            # synthetic samples per run (single source of truth;
                              # dataset pool is loaded to match)
  timeout: 300                 # per-request HTTP timeout in seconds (SDK default: 600)
  max_retries: 2               # SDK retries on 5xx/429 (SDK default: 2)
  request_delay: 10            # seconds to sleep between requests to respect provider TPM limits
  # api_key is auto-resolved from api_keys[provider]; uncomment to override:
  # api_key: "..."

# ── Profiling (optional LLM used by profile_dataset --topics) ──
# Same shape as `generation`. If omitted/incomplete, --topics falls back
# to the `generation` LLM with a warning (mirrors the judge fallback).
# api_key auto-resolved from api_keys[provider].
profiling:
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 0
  max_tokens: 1024
  timeout: 300
  max_retries: 2

# ── Judge (optional LLM-as-judge that filters bad generations) ──
# If omitted or enabled=false → judging is skipped.
# Same shape as `generation`. api_key auto-resolved from api_keys[provider].
judge:
  enabled: true
  provider: "openrouter"
  model: "minimax-m3"
  temperature: 0
  max_tokens: 1024
  timeout: 300
  max_retries: 1

# ── Evaluation ──────────────────────────────────────────────
evaluation:
  real_baseline: true # also evaluate task_models on the real benchmark (deterministic, no runs)

# ── Task ────────────────────────────────────────────────────
task:
  name: "gec"

# ── Task Models (models under evaluation) ───────────────────
task_models:
  - name: "vennify/t5-base-grammar-correction"
    type: "t5"
  - name: "prithivida/grammar_error_correcter_v1"
    type: "gec_v1"
  - name: "grammarly/coedit-large"
    type: "coedit"

# ── Compute ─────────────────────────────────────────────────
# Device for HuggingFace/torch models (CoLA scorer + the seq2seq GEC
# models under evaluation: t5, gec_v1, coedit).
# auto = use GPU only if available AND its compute capability is supported
#        by the installed PyTorch build (otherwise CPU).
# cpu  = force CPU.
# cuda = force GPU (will crash if not supported).
compute:
  device: cpu

# ── Output ──────────────────────────────────────────────────
# Every run session gets its own directory under base_dir/<task>/<session>/:
#   generated/run_<N>.json  — each run's synthetic data (never reused for eval)
#   results.json            — {"meta": <provenance>, "results": <scores>},
#                              rewritten after every run (meta.partial is true
#                              until the last run finishes)
#   real_sample.json        — the real reference sample used for baseline/profiling
#   profile.json            — {"real", "generated", "fidelity"} dataset profile
#   plots/                  — figures (if generated)
output:
  base_dir: "framework/data/runs"
  plots: true # render figures into <session>/plots/ at the end of a run (--no-plots to skip)
