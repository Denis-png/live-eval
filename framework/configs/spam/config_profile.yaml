api_keys:
  groq: "${GROQ_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  openrouter: "${OPENROUTER_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  minimax: "${MINIMAX_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  huggingface: "${HF_TOKEN}"

# ── Dataset ─────────────────────────────────────────────────
# Seedless mode does not use real messages as seeds, but the dataset is still
# needed to build the benchmark profile (run profile_dataset first).
dataset:
  source: local
  local:
    path: "framework/data/spam/sms_spam_sample_300.csv"
    format: csv

# ── IMPORTANT: run profile_dataset before this config ───────
# python -m framework.profiling.profile_dataset \
#     --config framework/configs/spam/config_profile.yaml
# This produces framework/data/profiles/spam_profile.json which
# seedless mode reads to generate content specs per sample.
generation:
  seedless: true
  # profile_path: "framework/data/profiles/spam_profile.json"  # default
  provider: "openrouter"
  model: "deepseek/deepseek-v4-flash"
  temperature: 1.0
  max_tokens: 1024
  num_runs: 3
  sample_size: 150
  class_balance: empirical
  timeout: 300
  max_retries: 2
  request_delay: 2

judge:
  enabled: false

evaluation:
  real_baseline: true

task:
  name: "spam"
  variant: "profile"   # tags output folder (spam_profile/) and results.json meta

task_models:
  - name: "mshenoda/roberta-spam"
    type: "roberta"
  - name: "mariagrandury/roberta-base-finetuned-sms-spam-detection"
    type: "roberta"
  - name: "mrm8488/bert-tiny-finetuned-sms-spam-detection"
    type: "bert_tiny"
  - name: "wesleyacheng/sms-spam-classification-with-bert"
    type: "bert"

compute:
  device: cpu

output:
  base_dir: "framework/data/runs"
  plots: true
