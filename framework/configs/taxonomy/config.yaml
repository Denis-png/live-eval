# Taxonomy Induction — benchmark + task selection.
#
# This is the config `python -m framework.profile_dataset` and the taxonomy
# tooling read. It deliberately carries NO `generation:` block by default,
# unlike the other tasks — but `generation.mode` / `generation.seedless` DO
# apply here; add a `generation:` block to set them:
#
#   Taxonomy uses the `structured` strategy — one sample is a whole artifact.
#   It IS on the mode axis: `inverse` (the default) imposes a structural target
#   sampled from the real profile and iterates toward it with the feedback loop;
#   `forward` supplies only the domain and lets every structural property emerge,
#   which is the baseline for judging what the feedback loop buys. Set it with
#   `generation.mode: forward`.
#
#   `seedless` is effectively pinned to true: seeded structured generation
#   (perturb a real ontology subtree, keep the perturbation as ground truth) is
#   coherent but unimplemented, and `seedless: false` says exactly that.
#
# There is also no compare.yaml for this task yet: a multi-model comparison
# needs a complete pipeline config (generation + task_models), and no working
# end-to-end taxonomy run config exists in the repo — docs/taxonomy_induction.md
# points at a `taxonomy_run.yaml` that was never committed, and records that the
# last end-to-end smoke run did not produce a valid taxonomy.

dataset:
  source: local
  local:
    path: "framework/data/benchmarks/taxonomy/pizza.jsonl"
    format: jsonl

task:
  name: taxonomy
