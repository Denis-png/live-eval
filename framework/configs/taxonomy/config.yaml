# Taxonomy Induction — full pipeline config.
#
# Read by both `python -m framework.main --config framework/configs/taxonomy/config.yaml`
# and `python -m framework.profile_dataset --task taxonomy --config <this file>`.
# The profiler only needs `dataset:`; the rest drives a run.
#
# ── Prerequisites ────────────────────────────────────────────────────────────
# framework/data/** is gitignored, so the two inputs below are built locally and
# do not ship with the repo. Both steps are one-off per ontology:
#
#   1. Build the benchmark from an OWL/RDF ontology:
#        python -m scripts.prepare_taxonomy_benchmark <ontology.owl> \
#            framework/data/benchmarks/taxonomy/pizza.jsonl \
#            --ontology-id pizza --domain "pizza"
#
#   2. Profile it (the structural target inverse mode samples from):
#        python -m framework.profile_dataset --task taxonomy \
#            --config framework/configs/taxonomy/config.yaml
#
# `python -m framework.main` fails fast naming the profile if step 2 is missing.

api_keys:
  groq: "${GROQ_API_KEY}"
  openai: "${OPENAI_API_KEY}"
  openrouter: "${OPENROUTER_API_KEY}"
  mistral: "${MISTRAL_API_KEY}"
  minimax: "${MINIMAX_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  huggingface: "${HF_TOKEN}"

# ── Dataset ─────────────────────────────────────────────────────────────────
dataset:
  source: local
  local:
    path: "framework/data/benchmarks/taxonomy/pizza.jsonl"
    format: jsonl

task:
  name: taxonomy

# ── Generation ──────────────────────────────────────────────────────────────
# Taxonomy uses the `structured` strategy: one sample is a whole artifact, not a
# sentence. It IS on the mode axis like every other task —
#
#   inverse (default) — a structural target is sampled from the real profile and
#                       IMPOSED on the artifact, with the feedback loop iterating
#                       toward it. The loop IS the inverse mechanism.
#   forward           — only the domain is supplied; every count, depth and
#                       branching property EMERGES. This is the baseline that
#                       answers what targeting and the feedback loop actually buy,
#                       so it runs with feedback off (enabling it here is refused,
#                       since forward imposes no target for the loop to chase).
#
# `seedless` is effectively pinned to true. Seeded structured generation —
# perturb a real ontology subtree and keep the perturbation as ground truth — is
# coherent but unimplemented, and `seedless: false` says exactly that.
generation:
  mode: inverse
  seedless: true
  # profile_path: "framework/data/profiles/taxonomy/<benchmark>_<n>_taxonomy_profile.json"
  #   Only needed to disambiguate when the task dir holds several profiles;
  #   otherwise the single profile in that directory is used.
  provider: "openrouter"           # groq | openai | openrouter | mistral | minimax | anthropic | google
  model: "minimax-m3"
  temperature: 1.0
  max_tokens: 16384            # HARD CAP on the response, honoured by every provider.
                               # A whole taxonomy is far longer than a sentence, and
                               # a reasoning model spends budget on <think> before
                               # emitting any of it — 4096 truncated every artifact
                               # on the last smoke run (docs/taxonomy_induction.md).
  num_runs: 3                  # repeat N times → outputs mean ± std
  sample_size: 10              # whole taxonomies per run; each costs a full artifact
                               # plus up to max_rounds feedback calls, so this is an
                               # order of magnitude below the sentence tasks.
  timeout: 600                 # a whole artifact takes far longer than one sentence
  max_retries: 2
  request_delay: 0.0

  # Structural feedback loop — defaults live in taxonomy.json; override here.
  # Only meaningful under mode: inverse.
  feedback:
    enabled: true
    max_rounds: 1

# ── Evaluated models ────────────────────────────────────────────────────────
# The model under test receives {domain, classes} and must predict the direct
# subclass axioms. Gold axioms are never in its prompt.
task_models:
  - name: "minimax-m3"
    type: "llm"
    provider: "openrouter"
    api_key: "${OPENROUTER_API_KEY}"
    temperature: 0
    max_tokens: 8192
    timeout: 600
    max_retries: 2

# ── Compute ─────────────────────────────────────────────────────────────────
compute:
  device: "cpu"
  batch_size: 8
